      Object.assign(m, { at: .62 * Math.random() + .38 * low, dx: (Math.random() - .5) * 190, dy: -(140 + Math.random() * 420) * (.6 + .4 * low), ph: Math.random() * TAU });
    }
    this.img = img;
    this.iris = iris;
    this.voice = this.room.parts.find(p => p.badge === 'vocal');
  }
  update({ mix }) {
    const target = clamp((.8 - mix) / .65);
    this.gone = ease(this.gone, target, target > this.gone ? .011 : .016);
  }
  scene({ g, t, K }) {
    const { o, img, gone } = this, s = o.scale, X = o.x, Y = o.y;
    const solid = reduceMotion ? 1 - gone : Math.max(0, 1 - gone * 1.9);
    if (solid > .003) { g.globalAlpha = solid; g.drawImage(img, X * K, Y * K, img.width * s * K, img.height * s * K); }
    if (!reduceMotion && gone > .004) {
      const st = this.step, size = st * s * K * 1.2;
      for (const m of this.motes) {
        const away = clamp((gone * 1.4 - m.at) / .4);
        const a = away > 0 ? (1 - away) * (away < .15 ? 1 : 1 - (away - .15) * .4) : 1 - solid;
        if (a < .01) continue;
        const e = away * away;
        g.globalAlpha = a;
        g.drawImage(img, m.x, m.y, st, st, (X + m.x * s + m.dx * e + Math.sin(t * .0011 + m.ph) * 18 * away) * K, (Y + m.y * s + m.dy * e) * K, size, size);
      }
    }
    g.globalAlpha = 1;

    const er = o.eye_r * s, ex = X + o.eye_x * s, ey = Y + o.eye_y * s, eyeA = clamp(1 - (gone - .72) / .2);
    const v = this.voice, voice = v && v.value > ON ? v.signal : 0;
    if (voice > .02 && eyeA > 0) {
      const glow = g.createRadialGradient(ex * K, ey * K, er * .2 * K, ex * K, ey * K, er * 2.6 * K);
      glow.addColorStop(0, `rgba(255,170,90,${.32 * voice * eyeA})`);
      glow.addColorStop(1, 'rgba(255,120,40,0)');
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = glow; g.fillRect((ex - er * 3) * K, (ey - er * 3) * K, er * 6 * K, er * 6 * K);
      g.globalCompositeOperation = 'source-over';
    }
    const { pointer, staring } = this.room, [tx, ty] = !staring && pointer.has ? gazeToward(pointer.x, pointer.y, ex, ey, er) : [0, 0];
    look(this.gaze, tx, ty, staring ? 1.35 : 1 - voice * .3, .08);
    if (eyeA > .01) { g.globalAlpha = eyeA; drawIris(g, this.iris, ex * K, ey * K, er * K, this.gaze); g.globalAlpha = 1; }
  }
}

// A dark silhouette with one red eye; he sinks as the mix fills and the other eyes turn to him.
class Outsider {
  sink = 0;
  gaze = { ox: 0, oy: 0, pup: 1.1 };
  constructor(room, data) { this.room = room; this.o = data.outsider; this.r = 64 * this.o.scale; }
  async load() {
    const o = this.o, figure = await loadImage(`${songBase(o.song, this.room.song.base)}${o.figure}.webp`);
    const [img, x] = makeCanvas(figure.width, figure.height);
    x.drawImage(figure, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = 'rgba(14,6,3,.9)'; x.fillRect(0, 0, img.width, img.height);
    const kitIris = this.room.iris, [iris, ix] = makeCanvas(256);
    ix.drawImage(kitIris, 0, 0, 256, 256);
    ix.globalCompositeOperation = 'multiply'; ix.fillStyle = '#ff2a18'; ix.fillRect(0, 0, 256, 256);
    ix.globalCompositeOperation = 'destination-in'; ix.drawImage(kitIris, 0, 0, 256, 256);
    Object.assign(this, { img, iris, sclera: await kit(`sclera-${o.sclera ?? 3}.webp`) });
  }
  update({ mix }) {
    const o = this.o, s = o.scale;
    this.sink = ease(this.sink, clamp((mix - .15) / .7), .015);
    this.y = o.y + this.sink * o.sink;
    this.ex = o.x + (o.eye_x - o.fig_x) * s;
    this.ey = this.y + (o.eye_y - o.fig_y) * s;
    this.visible = this.ey < 1010;   // above the desk
  }
  scene({ g, K }) {
    const { o, img, room: { pointer } } = this, s = o.scale;
    g.drawImage(img, o.x * K, this.y * K, img.width * s * K, img.height * s * K);
    const [tx, ty] = pointer.has ? gazeToward(pointer.x, pointer.y, this.ex, this.ey, this.r, .1) : [0, 0];
    look(this.gaze, tx, ty, 1.1, .05);
    if (this.visible) drawKitEye(g, this.sclera, this.iris, this.ex * K, this.ey * K, this.r * K, this.gaze);
  }
}

// Rising sparks; fewer while the outsider is sunk.
class Embers {
  constructor(room) {
    this.room = room;
    this.sparks = Array.from({ length: 90 }, () => ({ x: Math.random() * 1080, y: 1000 + Math.random() * 900, v: .6 + Math.random() * 1.6, s: 1.5 + Math.random() * 3, p: Math.random() * 6 }));
  }
  scene({ g, t, K }) {
    if (reduceMotion) return;
    const out = this.room.outsider, n = Math.floor(this.sparks.length * (out ? .2 + .8 * (1 - out.sink) : .6));
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < n; i++) {
      const e = this.sparks[i];
      e.y -= e.v;
      e.x += Math.sin(t * .001 + e.p) * .4;
      if (e.y < 300) { e.y = 1050 + Math.random() * 700; e.x = Math.random() * 1080; }
      g.fillStyle = `rgba(255,${120 + Math.floor(60 * Math.sin(e.p + t * .003))},40,${.55 * clamp((e.y - 300) / 500)})`;
      g.beginPath(); g.arc(e.x * K, e.y * K, e.s * K, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = 'source-over';
  }
}

// Firelight flicker.
class Flicker {
  scene({ g, t, W, H }) {
    if (reduceMotion) return;
    const a = .07 + .04 * Math.sin(t * .011) + .03 * Math.sin(t * .029 + 1.3) + (Math.random() < .05 ? .04 : 0);
    g.fillStyle = `rgba(18,7,2,${Math.max(0, a)})`;
    g.fillRect(0, 0, W, H);
  }
}

// A sleeping eye leaves a pale copy that floats up.
class Afterimages {
  ghosts = [];
  constructor(room) { this.room = room; }
  sleep(p) {
    if (!reduceMotion && this.ghosts.length < 24)
      this.ghosts.push({ p, x: p.x, y: this.room.eyeY(p), born: performance.now(), ox: p.gaze.ox, oy: p.gaze.oy });
  }
  front({ g, t, K }) {
    if (!this.ghosts.length) return;
    this.ghosts = this.ghosts.filter(a => t - a.born < 2600);
    for (const { p, x, y, born, ox, oy } of this.ghosts) {
      const age = (t - born) / 2600, rise = 1 - (1 - age) ** 2;
      g.globalAlpha = .6 * (1 - age) ** 1.6;
      drawKitEye(g, p.sclera, p.irisImg, (x + Math.sin(age * 5 + p.phase) * 14 * age) * K, (y - rise * 300) * K, p.r * (1 + age * .6) * K,
        { ox: ox * (1 - age), oy: oy * (1 - age) - .3 * age, pup: 1 + age * .8 });
    }
    g.globalAlpha = 1;
  }
}

// Rain with the mix, rare lightning on drum hits; with 'clearing', the empty room clears to dawn.
class Weather {
  storm = 0;
  flashUntil = 0;
  lastFlash = 0;
  constructor(room, data) {
    this.room = room;
    this.clearName = data.effects.includes('clearing') && data.room_clear;
    this.drops = Array.from({ length: 420 }, () => ({ x: Math.random() * 1200 - 60, y: Math.random() * 1920, v: 22 + Math.random() * 26, len: 28 + Math.random() * 46 }));
  }
  async load() { if (this.clearName) this.clear = await kit(`room-${this.clearName}.jpg`); }
  update({ mix }) { this.storm = ease(this.storm, Math.min(1, mix * 1.8), .02); }
  light({ g, W, H }) {
    if (!this.clear) return;
    g.globalAlpha = 1 - this.storm; g.drawImage(this.clear, 0, 0, W, H); g.globalAlpha = 1;
  }
  scene({ g, K }) {
    const s = this.storm;
    if (reduceMotion || s <= .02) return;
    g.strokeStyle = `rgba(200,215,230,${.1 + .22 * s})`;
    g.lineWidth = Math.max(1, 1.6 * K);
    g.lineCap = 'round';
    g.beginPath();
    for (let i = 0, n = Math.floor(this.drops.length * s); i < n; i++) {
      const d = this.drops[i];
      d.y += d.v * (.6 + .4 * s);
      d.x -= d.v * .18;
      if (d.y > 1920) { d.y = -d.len; d.x = Math.random() * 1200 - 60; }
      g.moveTo(d.x * K, d.y * K);
      g.lineTo((d.x + d.len * .18) * K, (d.y - d.len) * K);
    }
    g.stroke();
  }
  front({ g, t, W, H }) {
    const drums = this.room.parts[0];
    if (!reduceMotion && this.storm > .6 && drums.signal > .55 && t - this.lastFlash > 7000 && Math.random() < .15) {
      this.flashUntil = t + 110;
      this.lastFlash = t;
    }
    if (t < this.flashUntil) { g.fillStyle = `rgba(225,232,245,${.22 * this.storm})`; g.fillRect(0, 0, W, H); }
  }
}

// Colour comes in with the parts: empty, the room is grey; each part floods it with its own colour,
// and the colour climbs from the floor to the ceiling as the mix fills.
class Colour {
  level = 0;
  constructor(room) { this.room = room; }
  async load() {
    const [grey, x] = makeCanvas(540, 960);
    x.drawImage(this.room.room, 0, 0, 540, 960);
    const img = x.getImageData(0, 0, 540, 960), d = img.data;
    for (let k = 0; k < d.length; k += 4) d[k] = d[k + 1] = d[k + 2] = (d[k] * .3 + d[k + 1] * .59 + d[k + 2] * .11) * .85;
    x.putImageData(img, 0, 0);
    this.grey = grey;
    this.blob = memo(color => {
      const [c, b] = makeCanvas(256), grad = b.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, color); grad.addColorStop(.45, `${color}aa`); grad.addColorStop(1, `${color}00`);
      b.fillStyle = grad; b.fillRect(0, 0, 256, 256);
      return c;
    });
  }
  update({ mix }) { this.level = ease(this.level, mix, .03); }
  light({ g, t, W, H, K }) {
    const lv = this.level, s = reduceMotion ? 0 : t * .00012;
    g.globalAlpha = clamp(1 - lv * 1.6);
    if (g.globalAlpha > .003) g.drawImage(this.grey, 0, 0, W, H);
    const n = this.room.parts.length;
    for (const p of this.room.parts) {
      const amount = clamp(p.value / MIX), img = this.blob(p.color);
      if (amount < .01) continue;
      for (let j = 0; j < 3; j++) {   // each part keeps to its own stretch of wall, so the colours stay apart
        const ph = p.phase + j * 2.1, home = (p.i + .5) / n * 1080;
        const x = home + Math.sin(s * (1 + j * .35) + ph) * 160, y = 1500 - lv * 1050 + j * 260 + Math.cos(s * 1.2 + ph * 1.7) * 140;
        const r = (230 + 60 * j) * (.6 + .4 * amount) * (1 + p.signal * .5);
        g.globalCompositeOperation = 'color'; g.globalAlpha = .7 * amount;
        g.drawImage(img, (x - r) * K, (y - r) * K, 2 * r * K, 2 * r * K);
        g.globalCompositeOperation = 'screen'; g.globalAlpha = (.12 + .35 * p.signal) * amount;
        g.drawImage(img, (x - r * .7) * K, (y - r * .7) * K, 1.4 * r * K, 1.4 * r * K);
      }
    }
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
  }
}

// in drawing order
const EFFECTS = [['colour', Colour], ['fade', EmptyRoom], ['dissolve', Ghost], ['outsider', Outsider], ['embers', Embers], ['flicker', Flicker], ['afterimage', Afterimages], ['rain', Weather]];

const ROOMS = { faders: FaderRoom, sequencer: SequencerRoom };

// ——— way-in screen ————————————————————————————————————————————————————————————————————————————————————————
// The empty room, one big eye (tap it to start the album) and the track list.
// The tap that picks a song also unlocks audio, so the room then starts by itself.

const LOBBY_EYE = { x: 540, y: 500, r: 230 };   // in the room picture's 1080 × 1920 units
const LOBBY_LINES = ['go on, then', 'any of them', 'we can wait'];

class Lobby {
  gaze = { ox: 0, oy: 0, pup: 1 };
  pointer = null;          // { x, y, at } in page coordinates
  focus = null;            // the door being looked at
  blinkAt = -1e4; nextBlink = 2500; nextGlance = 0; glance = [0, 0];
  lastMove = performance.now(); line = 0;

  constructor(app) {
    this.app = app;
    this.g = ui.lobbyCanvas.getContext('2d');
    this.art = Promise.all(['room-night-spotlight.jpg', 'sclera-1.webp', 'iris-blue.webp'].map(kit))
      .then(([room, sclera, iris]) => Object.assign(this, { room, sclera, iris })).catch(console.error);
    this.buildDoors();
    const moved = e => { this.pointer = { x: e.clientX, y: e.clientY, at: performance.now() }; this.stir(); };
    ui.lobby.addEventListener('pointermove', moved);
    ui.lobby.addEventListener('pointerdown', moved);
    ui.lobby.addEventListener('scroll', () => this.stir(), { passive: true });
    // tapping the eye starts the album at track 1
    const onEye = e => { const b = ui.lobbyCanvas.getBoundingClientRect(), [x, y, r] = this.eye ?? [0, 0, 0];
      return Math.hypot(e.clientX - b.left - x, e.clientY - b.top - y) < r * 1.05; };
    ui.lobbyCanvas.addEventListener('click', e => onEye(e) && this.choose(ORDER[0]));
    ui.lobbyCanvas.addEventListener('pointermove', e => {
      this.hover = onEye(e);
      ui.lobbyCanvas.classList.toggle('on-eye', this.hover);
    });
    ui.lobbyCanvas.addEventListener('pointerleave', () => { this.hover = false; });
    ui.beginBtn.onclick = () => this.choose(ORDER[0]);
    if (!matchMedia('(pointer:coarse)').matches) ui.beginBtn.textContent = 'Click the eye to begin';
  }

  buildDoors() {
    ui.doors.replaceChildren(...ORDER.map(key => {
      const song = SONGS[key], li = document.createElement('li'), row = document.createElement('button');
      row.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
      row.querySelector('.n').textContent = pad2(song.track);
      row.querySelector('.t').textContent = song.title;
      row.querySelector('.d').textContent = song.dur;
      row.onclick = () => this.choose(key);
      const look = () => { this.focus = row; this.stir(); }, away = () => { if (this.focus === row) this.focus = null; };
      row.addEventListener('pointerenter', look);
      row.addEventListener('focus', look);
      row.addEventListener('pointerleave', away);
      row.addEventListener('blur', away);
      li.append(row);
      return li;
    }));
    const words = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve'];
    ui.moreRooms.textContent = SHUT.length ? `${words[SHUT.length] ?? SHUT.length} more ${SHUT.length > 1 ? 'rooms' : 'room'} to come.` : '';
  }

  get isOpen() { return !ui.lobby.hidden && !ui.lobby.classList.contains('gone'); }

  open() {
    clearTimeout(this.hiding);
    this.closing = null;
    ui.lobby.hidden = false;
    ui.lobby.classList.remove('gone');
    ui.wrap.inert = true;
    this.stir();
    if (!this.running) { this.running = true; requestAnimationFrame(t => this.frame(t)); }
  }
  close() {
    ui.lobby.classList.add('gone');
    ui.wrap.inert = false;
    this.hiding = setTimeout(() => { ui.lobby.hidden = true; this.running = false; }, reduceMotion ? 0 : 700);
  }

  // Picks a song; audio is resumed inside the tap so phones allow it.
  choose(key) {
    audioContext().resume();
    const { app } = this;
    app.entered = true;
    this.focus = null;
    this.closing = performance.now();   // eye shuts, then the screen fades
    setTimeout(() => this.close(), reduceMotion ? 0 : 260);
    if (key !== app.key) app.go(key);
    else if (!ui.enterBtn.hidden && !ui.enterBtn.disabled) ui.enterBtn.click();
  }

  stir() {
    this.lastMove = performance.now();
    if (this.staring) { this.staring = false; ui.lobbyWhisper.classList.remove('on'); }
  }

  frame(t) {
    if (!this.running) return;
    requestAnimationFrame(t => this.frame(t));
    const cv = ui.lobbyCanvas, box = cv.getBoundingClientRect(), DPR = Math.min(2, devicePixelRatio || 1);
    if (!box.width) return;
    const w = Math.round(box.width * DPR), h = Math.round(box.height * DPR);
    if (cv.width !== w || cv.height !== h) Object.assign(cv, { width: w, height: h });
    const { g } = this, W = box.width, H = box.height;
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = '#0d0e10';
    g.fillRect(0, 0, W, H);
    if (!this.room) return;

    // room picture, cover-fitted from the top; the eye hangs above the floor
    const K = Math.max(W / 1080, H / 1920), left = (W - 1080 * K) / 2;
    g.drawImage(this.room, left, 0, 1080 * K, 1920 * K);
    const x = left + LOBBY_EYE.x * K, y = LOBBY_EYE.y * K, r = LOBBY_EYE.r * K;
    this.eye = [x, y, r];
    const below = `${Math.round(y + r + 22)}px`;
    if (ui.beginBtn.style.top !== below) ui.beginBtn.style.top = below;

    // gaze: the eye itself under the pointer, a hovered song, the pointer, or idle glances; stares when left alone
    const idle = t - this.lastMove, staring = idle > IDLE_MS * .8 && !this.focus;
    if (staring !== !!this.staring) {
      this.staring = staring;
      if (staring) ui.lobbyWhisper.textContent = LOBBY_LINES[this.line++ % LOBBY_LINES.length];
      ui.lobbyWhisper.classList.toggle('on', staring);
    }
    let ox, oy, pup = 1;
    const at = this.hover ? null : this.focus?.getBoundingClientRect() ?? (this.pointer && t - this.pointer.at < 4000 && { left: this.pointer.x, top: this.pointer.y, width: 0, height: 0 });
    if (staring || this.hover) [ox, oy, pup] = [0, 0, this.hover ? 1.4 : .75];
    else if (at) {
      [ox, oy] = gazeToward(at.left + at.width / 2 - box.left, at.top + at.height / 2 - box.top, x, y, r);
      if (this.focus) pup = 1.35;
    } else {
      if (t > this.nextGlance && !reduceMotion) {   // look around the room now and then
        this.glance = Math.random() < .35 ? [0, 0] : [(Math.random() - .5) * .8, (Math.random() - .35) * .6];
        this.nextGlance = t + 1400 + Math.random() * 2600;
      }
      [ox, oy] = this.glance;
    }
    look(this.gaze, ox, oy, pup, at ? .14 : .06);

    g.globalAlpha = .22;
    g.drawImage(GLOW, x - r * 1.6, y - r * 1.6, r * 3.2, r * 3.2);
    g.globalAlpha = 1;
    drawKitEye(g, this.sclera, this.iris, x, y, r, this.gaze);

    // lids: slightly lowered at rest, open when interested, narrowed when staring, shut on leaving
    if (t > this.nextBlink) { this.blinkAt = t; this.nextBlink = t + 2500 + Math.random() * 5000; }
    const blink = t - this.blinkAt < 170 ? Math.sin(Math.PI * (t - this.blinkAt) / 170) : 0;
    const rest = this.focus || this.hover ? 0 : staring ? .3 : .12;
    this.lid = ease(this.lid ?? rest, rest, .08);
    const shut = this.closing ? clamp((t - this.closing) / 200) : 0;
    this.drawLids(g, x, y, r, Math.max(this.lid, blink, shut));

    const v = g.createRadialGradient(W / 2, H * .45, W * .3, W / 2, H * .45, H * .8);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.45)');
    g.fillStyle = v;
    g.fillRect(0, 0, W, H);
  }

  // Upper and lower lids, clipped to the eye; closed 0…1.
  drawLids(g, x, y, r, closed) {
    if (closed < .01) return;
    const sag = r * .35 * (1 - closed), top = y - r * 1.4 + closed * r * 1.55, bottom = y + r * 1.4 - closed * r * 1.25;
    g.save();
    g.beginPath(); g.arc(x, y, r * .985, 0, TAU); g.clip();
    g.fillStyle = '#0c0c0e';
    g.strokeStyle = 'rgba(0,0,0,.9)';
    g.lineWidth = Math.max(1.5, r * .03);
    for (const [edge, out, bend] of [[top, -1, -1], [bottom, 1, 1]]) {
      g.beginPath();
      g.moveTo(x - r * 1.1, edge - bend * sag);
      g.quadraticCurveTo(x, edge + bend * sag, x + r * 1.1, edge - bend * sag);
      g.lineTo(x + r * 1.1, y + out * r * 1.1);
      g.lineTo(x - r * 1.1, y + out * r * 1.1);
      g.closePath();
      g.fill();
      g.beginPath();
      g.moveTo(x - r * 1.1, edge - bend * sag);
      g.quadraticCurveTo(x, edge + bend * sag, x + r * 1.1, edge - bend * sag);
      g.stroke();
    }
    g.restore();
  }
}

// ——— host messages ————————————————————————————————————————————————————————————————————————————————————————
// When embedded in an iframe the engine talks to its host page with postMessage (see README, "Host API").
// Out: { source: 'roomtone', type, version, song, ... }. In: { target: 'roomtone', type: 'play' | 'pause' | 'song' | 'state', key }.
// The older plain strings 'roomtone:playing' (out) and 'roomtone:pause' (in) still work.

const host = {
  embedded: parent !== window,
  tell(type, app, extra = {}) {
    if (!this.embedded) return;
    const s = app?.key && SONGS[app.key], m = app?.room?.mixer;
    if (type === 'playing') parent.postMessage('roomtone:playing', '*');
    parent.postMessage({ source: 'roomtone', type, version: ENGINE_VERSION,
      song: s ? { key: app.key, track: s.track, title: s.title } : null,
      playing: audioContext().state === 'running',
      position: m ? Math.round(m.position * 10) / 10 : 0, duration: m ? Math.round(m.duration * 10) / 10 : 0, ...extra }, '*');
  },
  listen(app) {
    addEventListener('message', e => {
      let d = e.data; const ctx = audioContext();
      if (d === 'roomtone:pause') d = { target: 'roomtone', type: 'pause' };
      if (!d || d.target !== 'roomtone') return;
      if (d.type === 'pause' && ctx.state === 'running') ctx.suspend();
      else if (d.type === 'play' && app.entered) ctx.resume();   // before the listener's first tap the browser won't allow sound
      else if (d.type === 'song' && SONGS[d.key]) { if (app.lobby.isOpen) app.lobby.close(); app.go(d.key); }
      else if (d.type === 'state') this.tell('state', app);
    });
  },
};

// ——— app: song switching, title card, transport, tracklist ————————————————————————————————————————————————

const PLAY_ICON = 'M3 1.5v11l9.5-5.5z', PAUSE_ICON = 'M3 2h3v10H3zM8 2h3v10H8z';

class App {
  view = { W: 0, H: 0, DPR: 1 };
  room = null;
  key = null;
  entered = false;   // the listener has come into a room at least once
  visible = true;

  constructor() {
    new ResizeObserver(() => this.resize()).observe(ui.c);
    new IntersectionObserver(([e]) => { this.visible = e.isIntersecting; }).observe(ui.stage);
    document.fonts?.ready.then(() => this.room?.drawable && this.room.resize());
    audioContext().addEventListener('statechange', () => {
      this.showPlayState();
      host.tell(audioContext().state === 'running' ? 'playing' : 'paused', this);
    });
    host.listen(this);
    this.buildTracklist();
    this.bindControls();
    this.lobby = new Lobby(this);
    // a song link opens its room; the bare page opens the way-in screen
    addEventListener('popstate', () => { const k = this.keyFromHash(); k ? (this.show(k), this.lobby.isOpen && this.lobby.close()) : this.lobby.open(); });
    addEventListener('hashchange', () => { const k = this.keyFromHash(); if (k) this.show(k); });
    const asked = params.get('song'), first = this.keyFromHash() ?? (SONGS[asked] ? asked : null);
    if (first) this.show(first);
    else this.lobby.open();
    this.showPlayState();
    requestAnimationFrame(t => this.loop(t));
  }

  keyFromHash() { const k = location.hash.slice(1); return SONGS[k] ? k : null; }

  go(key) {
    if (key === this.key) return;
    history.pushState(null, '', `#${key}`);
    this.show(key);
    if (matchMedia('(orientation:portrait) and (max-width:1024px)').matches) scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Swaps rooms: tears down the old one, shows the title card, loads the new one.
  async show(key) {
    if (key === this.key) return;
    const song = SONGS[key], Kind = ROOMS[song.mode] ?? FigureRoom;
    this.key = key;
    this.room?.destroy();
    this.loading?.abort();
    const loading = this.loading = new AbortController(), room = this.room = new Kind(song, this);
    this.whisperLine = 0;
    this.scrubbing = false;
    this.clockText = '';
    ui.whisper.classList.remove('on');
    ui.stems.replaceChildren();
    ui.how.innerHTML = Kind.how.map(line => `<div>${line}</div>`).join('');
    ui.c.setAttribute('aria-label', Kind.label);
    this.describe(song);
    this.showCard(song);
    host.tell('song', this);
    try {
      await room.open(loading.signal, p => this.progress(p));
    } catch (err) {
      if (loading.signal.aborted) return;
      console.error(err);
      host.tell('error', this, { message: String(err.message ?? err) });
      this.failCard();
      return;
    }
    if (room !== this.room) return;
    host.tell('loaded', this);
    ui.loadBar.style.width = '100%';
    const enter = () => room.start().then(() => room.wakeAll());
    if (this.entered) enter();
    else Object.assign(ui.enterBtn, { hidden: false, disabled: false, textContent: 'Enter the room', onclick: enter });
  }

  describe(song) {
    const i = ORDER.indexOf(this.key), prev = SONGS[ORDER[i - 1]], next = SONGS[ORDER[i + 1]];
    document.title = `${song.title} · ${ALBUM.title}`;
    ui.eyebrow.textContent = ui.cardNum.textContent = `${ALBUM.title} · track ${song.track}`;
    ui.songTitle.textContent = ui.cardTitle.textContent = ui.pkTitle.textContent = song.title;
    ui.pkNum.textContent = pad2(song.track);
    ui.blurb.textContent = song.blurb;
    ui.clock.textContent = `0:00 / ${song.dur}`;
    ui.scrub.value = 0;
    ui.prevSong.disabled = !prev;
    ui.nextSong.disabled = !next;
    ui.prevSong.setAttribute('aria-label', prev ? `Previous: ${prev.title}` : 'Previous song');
    ui.nextSong.setAttribute('aria-label', next ? `Next: ${next.title}` : 'Next song');
    for (const b of ui.tlList.querySelectorAll('button')) {
      const on = b.dataset.song === this.key, n = b.querySelector('.n');
      b.setAttribute('aria-current', on);
      if (on) n.innerHTML = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
      else n.textContent = pad2(SONGS[b.dataset.song].track);
    }
  }

  // ——— title card
  showCard() {
    ui.enter.hidden = false;
    ui.enter.classList.remove('gone');
    ui.loadBar.style.width = '0%';
    Object.assign(ui.enterBtn, { hidden: this.entered, disabled: true, textContent: 'Loading the room…', onclick: null });
    ui.enterNote.textContent = this.entered ? '' : 'sound on';
  }
  progress(p) {
    const pct = Math.round(p * 100);
    ui.loadBar.style.width = `${pct}%`;
    if (!this.entered) ui.enterBtn.textContent = `Loading the room… ${pct}%`;
  }
  failCard() {
    const key = this.key;
    Object.assign(ui.enterBtn, { hidden: false, disabled: false, textContent: 'The room didn’t load. Try again', onclick: () => { this.key = null; this.show(key); } });
    ui.enterNote.textContent = 'or pick another song';
  }
  started() {
    const room = this.room;
    this.entered = true;
    ui.enter.classList.add('gone');
    setTimeout(() => { if (room === this.room && ui.enter.classList.contains('gone')) ui.enter.hidden = true; }, 750);
    this.showPlayState();
  }

  whisper(on) {
    if (on) { const lines = SONGS[this.key].stare; ui.whisper.textContent = lines[this.whisperLine++ % lines.length]; }
    ui.whisper.classList.toggle('on', on);
  }

  // ——— drawing
  resize() {
    const r = ui.c.getBoundingClientRect(), DPR = Math.min(2, devicePixelRatio || 1);
    Object.assign(this.view, { W: r.width, H: r.height, DPR });
    ui.c.width = Math.round(r.width * DPR);
    ui.c.height = Math.round(r.height * DPR);
    if (this.room?.drawable) this.room.resize();
  }
  loop(t) {
    requestAnimationFrame(t => this.loop(t));
    const { room } = this;
    if (room?.mixer) this.showTime(room.mixer);   // even when the room is scrolled out of view
    if (!room?.drawable || !this.view.W || !this.visible) return;
    room.frame(t);
  }
  showTime(mixer) {
    const pos = this.scrubbing ? ui.scrub.value / 1000 * mixer.duration : mixer.position;
    const text = `${mmss(pos)} / ${mmss(mixer.duration)}`;
    if (text !== this.clockText) ui.clock.textContent = this.clockText = text;
    if (!this.scrubbing) ui.scrub.value = Math.round(pos / mixer.duration * 1000);
  }

  // ——— controls
  togglePlay() {
    if (!this.entered) { if (!ui.enterBtn.disabled && !ui.enterBtn.hidden) ui.enterBtn.click(); return; }
    const ctx = audioContext();
    ctx.state === 'running' ? ctx.suspend() : ctx.resume();
  }
  showPlayState() {
    const playing = this.entered && audioContext().state === 'running';
    ui.playIcon.setAttribute('d', playing ? PAUSE_ICON : PLAY_ICON);
    ui.playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    document.body.classList.toggle('paused', !playing);
  }
  step(by) { const k = ORDER[ORDER.indexOf(this.key) + by]; if (k) this.go(k); }

  bindControls() {
    // these act on the room's sound, starting it first if need be
    const withSound = fn => async () => { const r = this.room; if (!r?.buffers) return; await r.begin(); fn(r, r.mixer); };
    ui.wakeAll.onclick = withSound(r => r.wakeAll());
    ui.sleepAll.onclick = () => this.room?.drawable && this.room.sleepAll();
    ui.restart.onclick = () => this.room?.mixer?.seek(0);
    const seek = (m, s) => m.seek(clamp(s, 0, m.duration - .5));   // controls stop at the song's ends
    ui.back10.onclick = withSound((r, m) => seek(m, m.position - 10));
    ui.fwd10.onclick = withSound((r, m) => seek(m, m.position + 10));
    ui.scrub.oninput = () => { this.scrubbing = true; };
    ui.scrub.onchange = withSound((r, m) => { seek(m, ui.scrub.value / 1000 * m.duration); this.scrubbing = false; });
    ui.playBtn.onclick = () => this.togglePlay();
    ui.prevSong.onclick = () => this.step(-1);
    ui.nextSong.onclick = () => this.step(1);
    // space plays and pauses, [ and ] change song, Escape closes the tracklist
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (this.lobby.isOpen) { if (e.key === 'Escape' && this.room) this.lobby.close(); return; }
      if (e.key === 'Escape') return this.closeList();
      if (e.key === 'Tab' && this.listOpen) {   // keep keyboard focus inside the open tracklist
        const stops = [...ui.tracklist.querySelectorAll('button')].filter(b => b.offsetParent), i = stops.indexOf(document.activeElement);
        e.preventDefault();
        stops.at((i + (e.shiftKey ? -1 : 1)) % stops.length).focus();
        return;
      }
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); this.togglePlay(); }
      else if (e.key === ']') this.step(1);
      else if (e.key === '[') this.step(-1);
    });
  }

  // ——— tracklist
  buildTracklist() {
    ui.tlList.replaceChildren(...ORDER.map(key => {
      const song = SONGS[key], li = document.createElement('li'), b = document.createElement('button');
      b.dataset.song = key;
      b.innerHTML = '<span class="th"></span><span class="n"></span><span class="t"><b></b><small></small></span><span class="d"></span>';
      b.querySelector('b').textContent = song.title;
      b.querySelector('small').textContent = song.blurb.split(/(?<=[.!?])\s/)[0];
      b.querySelector('.d').textContent = song.dur;
      b.onclick = () => { this.closeList(true); this.go(key); };
      li.append(b);
      return li;
    }));
    ui.pickBtn.onclick = () => this.listOpen ? this.closeList() : this.openList();
    ui.scrim.onclick = ui.tlClose.onclick = () => this.closeList();
    ui.howBtn.onclick = () => { this.closeList(true); this.lobby.open(); };
    addEventListener('pointerdown', e => {
      if (this.listOpen && !ui.tracklist.contains(e.target) && !ui.pickBtn.contains(e.target) && e.target !== ui.scrim) this.closeList(true);
    });
    // swipe the sheet down to close it
    let startY = null;
    ui.tracklist.addEventListener('touchstart', e => { startY = ui.tracklist.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
    ui.tracklist.addEventListener('touchmove', e => { if (startY !== null && e.touches[0].clientY - startY > 70) { startY = null; this.closeList(true); } }, { passive: true });
  }
  openList() {
    if (!this.thumbs) {   // the pictures load the first time the list opens
      this.thumbs = true;
      for (const b of ui.tlList.querySelectorAll('button')) b.querySelector('.th').style.backgroundImage = `url("${SONGS[b.dataset.song].thumb}")`;
    }
    this.setListOpen(true);
    const current = ui.tlList.querySelector('[aria-current="true"]');
    current.scrollIntoView({ block: 'nearest' });
    setTimeout(() => current.focus({ preventScroll: true }), 30);
  }
  closeList(quietly = false) {
    if (!this.listOpen) return;
    this.setListOpen(false);
    if (!quietly) ui.pickBtn.focus();
  }
  setListOpen(open) {
    this.listOpen = open;
    ui.tracklist.classList.toggle('open', open);
    ui.scrim.classList.toggle('open', open);
    ui.tracklist.inert = !open;
    ui.tracklist.setAttribute('aria-hidden', !open);
    ui.pickBtn.setAttribute('aria-expanded', open);
  }
}

// ——— boot ———————————————————————————————————————————————————————————————————————————————————————————————————

function showAlbumText() {
  document.title = ALBUM.title;
  ui.lbTitle.textContent = ui.tlAlbum.textContent = ALBUM.title;
  ui.lbArtist.textContent = ui.tlArtist.textContent = ui.byArtist.textContent = ALBUM.artist ?? '';
  ui.lbLede.textContent = ALBUM.lede ?? '';
  ui.lobby.setAttribute('aria-label', `${ALBUM.title}: the way in`);
}

try {
  await loadAlbum();
  showAlbumText();
  const app = new App();
  host.tell('ready', app, { album: { title: ALBUM.title, artist: ALBUM.artist,
    songs: ORDER.map(k => ({ key: k, track: SONGS[k].track, title: SONGS[k].title, dur: SONGS[k].dur })) } });
} catch (err) {
  console.error(err);
  document.body.innerHTML = '<p style="margin:20vh auto;text-align:center;font:italic 20px var(--display)">The rooms couldn’t open.</p>';
  host.tell('error', null, { message: String(err.message ?? err) });
}
</script>
